name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          path: notes
          fetch-depth: 0

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble site
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE="${OWNER}.github.io"
          else
            BASE="${OWNER}.github.io/${REPO}"
          fi
          rm -rf quartz/content
          mkdir -p quartz/content
          cp notes/首页.md quartz/content/index.md
          cp -a notes/项目 quartz/content/项目
          if [ -d notes/视图 ]; then cp -a notes/视图 quartz/content/视图; fi
          cp notes/quartz.config.yaml quartz/quartz.config.yaml
          sed -i "s|REPLACE_BASE_URL|${BASE}|g" quartz/quartz.config.yaml
          echo "baseUrl=${BASE}"

      - name: Install Quartz
        working-directory: quartz
        run: npm ci

      - name: Install plugins
        working-directory: quartz
        run: npx quartz plugin install --from-config

      - name: Build
        working-directory: quartz
        run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
