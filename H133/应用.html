<script>
(function () {
  var cache = {};
  function parse(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    return {
      nav: doc.querySelector("nav.side"),
      article: doc.querySelector("article"),
      footer: doc.querySelector("footer"),
      title: doc.title
    };
  }
  function apply(p, url, push) {
    if (!p || !p.nav || !p.article) { location.href = url; return; }
    document.querySelector("nav.side").replaceWith(p.nav.cloneNode(true));
    document.querySelector("article").replaceWith(p.article.cloneNode(true));
    if (p.footer) {
      var f = document.querySelector("footer");
      if (f) f.replaceWith(p.footer.cloneNode(true));
    }
    document.title = p.title;
    if (push) history.pushState({ u: url }, "", url);
    bind();
    prefetch();
  }
  function bind() {
    document.querySelectorAll("nav.side a.item.cat").forEach(function (a) {
      a.addEventListener("click", onCat);
    });
    document.querySelectorAll("nav.side a.item.board").forEach(function (a) {
      a.addEventListener("click", onBoard);
    });
    document.querySelectorAll("nav.side a.item.home, nav.side a.item.child, nav.side a.brand").forEach(function (a) {
      a.addEventListener("click", onNav);
    });
  }
  function onCat(e) {
    e.preventDefault();
    var g = this.closest(".group");
    if (g) g.classList.toggle("open");
  }
  function onBoard(e) {
    var sub = this.nextElementSibling;
    if (sub && sub.classList.contains("sub")) {
      e.preventDefault();
      sub.classList.toggle("folded");
      if (!sub.classList.contains("folded") && !this.classList.contains("current")) {
        go(this.href, true);
      }
      return;
    }
    onNav.call(this, e);
  }
  function mark(a) {
    document.querySelectorAll("nav.side a.item.current").forEach(function (el) {
      el.classList.remove("current");
    });
    a.classList.add("current");
  }
  function onNav(e) {
    var href = this.getAttribute("href");
    if (!href || /^(https?:|mailto:|#)/.test(href)) return;
    e.preventDefault();
    mark(this);
    go(this.href, true);
  }
  var VER = "v30";
  function fetchPage(url) {
    try {
      var u = new URL(url, location.href);
      u.searchParams.set("v", VER);
      return fetch(u.href, { cache: "reload" });
    } catch (e) {
      return fetch(url);
    }
  }
  function go(url, push) {
    if (cache[url]) { apply(cache[url], url, push); return; }
    fetchPage(url).then(function (r) { return r.text(); }).then(function (html) {
      cache[url] = parse(html);
      apply(cache[url], url, push);
    }).catch(function () { location.href = url; });
  }
  function prefetch() {
    document.querySelectorAll("nav.side a[href]").forEach(function (a) {
      var url = a.href;
      if (!url || cache[url]) return;
      fetchPage(url).then(function (r) { return r.text(); }).then(function (html) {
        cache[url] = parse(html);
      }).catch(function () {});
    });
  }
  window.addEventListener("popstate", function () { go(location.href, false); });
  bind();
  prefetch();
})();
</script>
